<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Videos, podcasts y documentos del Colegio INJUV, hechos por el Semillero de Tecnología Maker.">
  <title>La web de la iguana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/boceto.css">
</head>
<body data-pagina="inicio">

  <!-- El encabezado, las barras y el pie los inyecta assets/js/plantilla.js -->

  <main class="contenido">

    <section class="portada">
      <div class="ilustracion" aria-hidden="true">🦎</div>
      <div>
        <h1>Un café con la iguana</h1>
        <p>Lo que cemhaos en el colegio, contado por nosotros mismos.</p>
      </div>
    </section>

    <section>
      <h2>New videos</h2>
      <div class="carrusel">
        <div class="pista" id="pista-videos"></div>
        <button class="flecha-carrusel" type="button" aria-label="Ver más videos">›</button>
      </div>
    </section>

    <section>
      <h2>MP3 News</h2>
      <div class="carrusel">
        <div class="pista" id="pista-podcasts"></div>
        <button class="flecha-carrusel" type="button" aria-label="Ver más episodios">›</button>
      </div>
    </section>

    <section>
      <h2>DOCS news</h2>
      <div class="carrusel">
        <div class="pista" id="pista-documentos"></div>
        <button class="flecha-carrusel" type="button" aria-label="Ver más documentos">›</button>
      </div>
    </section>

  </main>

  <script src="assets/js/plantilla.js"></script>
  <script src="assets/js/contenido.js"></script>
  <script src="assets/js/carrusel.js"></script>
</body>
</html>
